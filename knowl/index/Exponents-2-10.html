<article class="assemblage assemblage-like"><h4 class="heading"><span class="title">Exponent.</span></h4>
<div class="para">An <dfn class="terminology">exponent</dfn> is a number that appears above and to the right of a particular factor. It tells us how many times that factor occurs in the expression.<div class="autopermalink" data-description="Paragraph"><a href="#Exponents-2-10-6" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para">The factor  to which the exponent applies is called the <dfn class="terminology">base</dfn>, and the product is called a <dfn class="terminology">power</dfn> of the base.<div class="autopermalink" data-description="Paragraph"><a href="#Exponents-2-10-7" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
