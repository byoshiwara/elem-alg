<article class="assemblage assemblage-like"><h4 class="heading"><span class="title">Slope-Intercept Form.</span></h4>
<div class="para logical">
<div class="para">A linear equation written in the form</div>
<div class="displaymath process-math">
\begin{equation*}
\blert{y=mx+b}
\end{equation*}
</div>
<div class="para">is said to be in <dfn class="terminology">slope-intercept form</dfn>. The coefficient <span class="process-math">\(m\)</span> is the slope of the graph, and <span class="process-math">\(b\)</span> is the <span class="process-math">\(y\)</span>-intercept.</div>
