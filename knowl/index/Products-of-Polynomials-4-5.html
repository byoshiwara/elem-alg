<div class="para logical">
<div class="para">To multiply two powers with the same base, we add the exponents and leave the base unchanged. In symbols,</div>
<div class="displaymath process-math">
\begin{equation*}
\blert{a^m \cdot a^n = a^{m+n}}
\end{equation*}
